name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 獲取最新代碼 (Checkout)
        uses: actions/checkout@v4

      - name: 傳輸檔案到伺服器 (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PWD }}
          source: "index.html"
          target: "/home/ubuntu/web"

      - name: 重啟 Nginx 容器 (SSH)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PWD }}
          script: |
            echo "開始部署最新的 Nginx 容器..."
            docker stop my-nginx || true
            docker rm my-nginx || true
            docker run -d --name my-nginx -p 80:80 -v /home/ubuntu/web:/usr/share/nginx/html nginx:latest
            echo "部署完成！"
