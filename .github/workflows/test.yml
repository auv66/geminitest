name: My First CI

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Say Hello
        run: echo "Hello DevOps! I am running on the cloud."

      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PWD }}
          script: |
            echo "連線成功！這裡是伺服器的執行現場："
            whoami
            pwd
            docker ps
