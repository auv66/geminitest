name: Deploy Stack

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 获取最新代码 (Checkout)
        uses: actions/checkout@v4

      - name: 传输全部文件到服务器 (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PWD }}
          source: "."  # 关键点：点号代表把 GitHub 上的所有文件(包括 compose 和 html)全传过去
          target: "/home/ubuntu/compose-test"

      - name: 自动部署多服务 (Compose)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PWD }}
          script: |
            cd /home/ubuntu/compose-test
            # 这一行就是 IaC 的核心，它会自动对比配置，拉起或更新多容器服务，完全无需手动干预
            docker compose up -d
            echo "部署完毕！当前多容器状态："
            docker compose ps
