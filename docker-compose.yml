name: beijing-devops-stack

services:
  # 前台大廳：Nginx 反向代理
  proxy:
    image: nginx:latest
    ports:
      - "80:80"  # 對外只開放標準 80 埠
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro  # 掛載剛才寫好的設定檔

  # 後端部門：一個超輕量的模擬 API 服務 (traefik/whoami)
  backend:
    image: traefik/whoami
    restart: always
    # 注意：這裡刻意不寫 ports！
    # 讓它完全隱藏在 Docker 內網，外部絕對連不進來，只能由 Nginx 代理訪問
