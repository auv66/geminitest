events {}

http {
    server {
        listen 80;

        # 當用戶訪問根目錄時，觸發反向代理
        location / {
            # 將請求轉發給內網名為 'backend' 的服務
            proxy_pass http://backend:80;
            
            # 把用戶的真實 IP 等資訊一起傳遞給後端
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
